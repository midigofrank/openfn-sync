id: sync-test
name: Sync test
start: webhook
steps:
  - id: log-payload
    name: Log payload
    adaptor: '@openfn/language-common@latest'
    expression: ./log-payload.js
  - id: webhook
    type: webhook
    webhook_reply: before_start
    next:
      log-payload:
        disabled: false
        condition: always
